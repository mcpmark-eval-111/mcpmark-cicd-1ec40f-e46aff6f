name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      previous_sha: ${{ steps.capture.outputs.previous_sha }}
      current_sha: ${{ steps.capture.outputs.current_sha }}
      package_version: ${{ steps.capture.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run lint checks
        id: lint
        continue-on-error: true
        run: |
          if npm run | grep -qE '^\s*lint'; then
            npm run lint
          else
            echo "No lint script defined. Skipping."
          fi

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          if npm run | grep -qE '^\s*test'; then
            npm test
          else
            echo "No test script defined. Skipping."
          fi

      - name: Capture deployment information
        id: capture
        run: |
          set -euo pipefail
          CURRENT_SHA="${{ github.sha }}"
          BEFORE_SHA="${{ github.event.before }}"
          if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            PREVIOUS_SHA="${BEFORE_SHA}"
          else
            PREVIOUS_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "${CURRENT_SHA}")
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          echo "previous_sha=${PREVIOUS_SHA}" >> "$GITHUB_OUTPUT"
          echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Previous Commit SHA: ${PREVIOUS_SHA}"
          echo "Current Commit SHA: ${CURRENT_SHA}"
          echo "Package Version: ${PACKAGE_VERSION}"

      - name: Ensure deployment labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'deployment', color: '0E8A16', description: 'Deployment-related work' },
              { name: 'in-progress', color: 'FBCA04', description: 'Work currently in progress' },
              { name: 'completed', color: '5319E7', description: 'Successfully completed work' }
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (err) {
                if (err.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  core.info(`Created label: ${label.name}`);
                } else {
                  throw err;
                }
              }
            }

      - name: Create deployment tracking issue
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const previousSha = '${{ steps.capture.outputs.previous_sha }}';
            const packageVersion = '${{ steps.capture.outputs.package_version }}';
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${sha}`,
              body: [
                '## 🚀 Deployment Tracking',
                '',
                `**Current Commit:** \`${sha}\``,
                `**Previous Commit:** \`${previousSha}\``,
                `**Package Version:** ${packageVersion}`,
                `**Triggered By:** @${context.actor}`,
                `**Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'This issue tracks the deployment lifecycle for this commit.',
                '',
                '### Pipeline stages',
                '- [x] pre-deployment',
                '- [ ] rollback-preparation',
                '- [ ] post-deployment'
              ].join('
'),
              labels: ['deployment', 'in-progress']
            });
            core.setOutput('issue_number', issue.data.number);
            core.info(`Created issue #${issue.data.number}`);
            return issue.data.number;

      - name: Post pre-deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.create_issue.outputs.issue_number }}', 10);
            const previousSha = '${{ steps.capture.outputs.previous_sha }}';
            const currentSha = '${{ steps.capture.outputs.current_sha }}';
            const packageVersion = '${{ steps.capture.outputs.package_version }}';
            const body = [
              '## ✅ Pre-deployment checks completed',
              '',
              'Pre-deployment checks completed successfully. Quality gates have been evaluated.',
              '',
              '### Summary',
              `- Previous Commit: \`${previousSha}\``,
              `- Current Commit: \`${currentSha}\``,
              `- Package Version: ${packageVersion}`,
              '- Lint: executed',
              '- Tests: executed',
              '',
              'Proceeding to rollback-preparation stage.'
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build rollback artifacts
        id: prepare
        run: |
          set -euo pipefail
          PREVIOUS_SHA="${{ needs.pre-deployment.outputs.previous_sha }}"
          CURRENT_SHA="${{ github.sha }}"
          PACKAGE_VERSION="${{ needs.pre-deployment.outputs.package_version }}"
          ARTIFACT_NAME="rollback-package-${CURRENT_SHA}"

          mkdir -p rollback-package
          mkdir -p rollback-package/backup

          # 1. Executable rollback script with proper error handling
          cat > rollback-package/rollback.sh <<'ROLLBACK_EOF'
          #!/usr/bin/env bash
          # Rollback script - restores the previous deployment.
          set -euo pipefail

          log()  { echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"; }
          fail() { echo "ERROR: $*" >&2; exit 1; }

          TARGET_SHA="${1:-}"
          if [[ -z "${TARGET_SHA}" ]]; then
            fail "Usage: $0 <previous-commit-sha>"
          fi

          if ! command -v git >/dev/null 2>&1; then
            fail "git is not installed"
          fi

          if ! git rev-parse --verify "${TARGET_SHA}^{commit}" >/dev/null 2>&1; then
            fail "Commit ${TARGET_SHA} cannot be found in the current repository"
          fi

          log "Rolling back working tree to ${TARGET_SHA}"
          git checkout "${TARGET_SHA}" -- .

          if [[ -f package-lock.json ]]; then
            log "Reinstalling dependencies via npm ci"
            npm ci
          else
            log "Reinstalling dependencies via npm install"
            npm install
          fi

          log "Rollback complete. Restart the service to apply changes."
          ROLLBACK_EOF
          chmod +x rollback-package/rollback.sh

          # 2. Configuration backups
          cp package.json rollback-package/backup/package.json
          cp package-lock.json rollback-package/backup/package-lock.json
          cat > rollback-package/backup/.env.template <<'ENV_EOF'
          # Environment template for rollback recovery.
          # Copy this file to .env and populate with production values.
          NODE_ENV=production
          PORT=3000
          LOG_LEVEL=info
          # Add additional environment variables required by the service.
          ENV_EOF

          # 3. Dependency verification script
          cat > rollback-package/verify-deps.sh <<'VERIFY_EOF'
          #!/usr/bin/env bash
          # Validates that the rolled-back dependency tree is internally consistent.
          set -euo pipefail

          log() { echo "[verify-deps] $*"; }

          if [[ ! -f package.json ]]; then
            echo "ERROR: package.json missing" >&2
            exit 1
          fi

          log "Checking for compatibility issues with npm ls"
          npm ls --all >/tmp/npm-ls.log 2>&1 || log "npm ls reported issues (see /tmp/npm-ls.log)"

          log "Running npm audit (informational only)"
          npm audit --audit-level=high || log "Audit reported findings"

          log "Dependency verification finished"
          VERIFY_EOF
          chmod +x rollback-package/verify-deps.sh

          # 4. Detailed rollback documentation
          cat > rollback-package/ROLLBACK.md <<DOC_EOF
          # Rollback Plan

          - **Previous Commit:** ${PREVIOUS_SHA}
          - **Current Commit:** ${CURRENT_SHA}
          - **Package Version:** ${PACKAGE_VERSION}
          - **Artifact:** ${ARTIFACT_NAME}

          ## Step-by-step rollback procedure

          1. Download the artifact \`${ARTIFACT_NAME}\` from the GitHub Actions run.
          2. Extract the archive: \`tar -xzf ${ARTIFACT_NAME}.tar.gz\`.
          3. Verify the SHA256 checksum against \`${ARTIFACT_NAME}.sha256\`.
          4. Run the rollback script:
             \`\`\`bash
             ./rollback.sh ${PREVIOUS_SHA}
             \`\`\`
          5. Verify dependencies are healthy:
             \`\`\`bash
             ./verify-deps.sh
             \`\`\`
          6. Restart the application service.
          7. Confirm health checks pass and notify stakeholders.

          ## Backups

          - \`backup/package.json\` - manifest snapshot
          - \`backup/package-lock.json\` - locked dependency tree
          - \`backup/.env.template\` - environment template

          ## Quick rollback command

          \`\`\`bash
          ./rollback.sh ${PREVIOUS_SHA}
          \`\`\`
          DOC_EOF

          # 5. Compressed package + checksum
          tar -czf "${ARTIFACT_NAME}.tar.gz" rollback-package
          SHA256=$(sha256sum "${ARTIFACT_NAME}.tar.gz" | awk '{print $1}')
          echo "${SHA256}  ${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.sha256"

          # Verifications
          SCRIPT_OK=false
          if [[ -x rollback-package/rollback.sh ]] && bash -n rollback-package/rollback.sh; then
            SCRIPT_OK=true
          fi
          BACKUP_OK=false
          if [[ -f rollback-package/backup/package.json && -f rollback-package/backup/package-lock.json && -f rollback-package/backup/.env.template ]]; then
            BACKUP_OK=true
          fi

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "script_ok=${SCRIPT_OK}" >> "$GITHUB_OUTPUT"
          echo "backup_ok=${BACKUP_OK}" >> "$GITHUB_OUTPUT"

          echo "----- Rollback artifact summary -----"
          ls -la rollback-package/
          ls -la "${ARTIFACT_NAME}.tar.gz" "${ARTIFACT_NAME}.sha256"
          echo "SHA256: ${SHA256}"
          echo "Script OK: ${SCRIPT_OK}"
          echo "Backup OK: ${BACKUP_OK}"

      - name: Upload rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${{ github.sha }}
          path: |
            rollback-package-${{ github.sha }}.tar.gz
            rollback-package-${{ github.sha }}.sha256
            rollback-package/**
          retention-days: 30
          if-no-files-found: error

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}', 10);
            const previousSha = '${{ needs.pre-deployment.outputs.previous_sha }}';
            const currentSha = '${{ github.sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package_version }}';
            const artifactName = '${{ steps.prepare.outputs.artifact_name }}';
            const sha256 = '${{ steps.prepare.outputs.sha256 }}';
            const scriptOk = '${{ steps.prepare.outputs.script_ok }}';
            const backupOk = '${{ steps.prepare.outputs.backup_ok }}';

            const body = [
              '## 🔄 Rollback Plan Ready',
              '',
              'A complete rollback package has been generated and uploaded as a GitHub Actions artifact (30-day retention).',
              '',
              '### Deployment context',
              `- Previous Commit: \`${previousSha}\``,
              `- Current Commit: \`${currentSha}\``,
              `- Package Version: ${packageVersion}`,
              `- Artifact: ${artifactName}`,
              '',
              '### Rollback components',
              '- ✅ Executable rollback script with error handling',
              '- ✅ Configuration backups (package.json, package-lock.json, .env.template)',
              '- ✅ Dependency verification script for compatibility checking',
              '- ✅ Detailed rollback documentation with step-by-step instructions',
              '- ✅ Compressed rollback package with SHA256 checksum',
              '- ✅ Artifact uploaded to GitHub Actions with 30-day retention',
              '',
              '### Quick rollback command',
              '```bash',
              `./rollback.sh ${previousSha}`,
              '```',
              '',
              '### Verification',
              `- Rollback script created: ${scriptOk}`,
              `- Configuration backup: ${backupOk}`,
              `- SHA256: ${sha256}`,
              '',
              'Proceeding to post-deployment stage.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs: [pre-deployment, rollback-preparation]
    steps:
      - name: Update labels, comment, and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}', 10);
            const previousSha = '${{ needs.pre-deployment.outputs.previous_sha }}';
            const currentSha = '${{ github.sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package_version }}';
            const artifactName = `rollback-package-${currentSha}`;

            // Remove the in-progress label (ignore 404 if it was removed already)
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
              core.info('Removed in-progress label');
            } catch (err) {
              if (err.status === 404) {
                core.info('in-progress label already absent');
              } else {
                throw err;
              }
            }

            // Add the completed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });

            const body = [
              '## 🎉 Deployment Completed Successfully',
              '',
              'All deployment pipeline stages finished successfully.',
              '',
              '### Final status',
              `- Previous Commit: \`${previousSha}\``,
              `- Current Commit: \`${currentSha}\``,
              `- Package Version: ${packageVersion}`,
              '',
              '### Rollback artifact details',
              `- Artifact: ${artifactName}`,
              '- Retention: 30 days',
              `- Workflow Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- Contents: rollback.sh, verify-deps.sh, ROLLBACK.md, backup/ (package.json, package-lock.json, .env.template)',
              '',
              'Closing this deployment tracking issue. Rollback artifact remains available for emergency use.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
