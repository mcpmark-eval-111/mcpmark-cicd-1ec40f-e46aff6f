name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      previous_sha: ${{ steps.capture.outputs.previous_sha }}
      current_sha: ${{ steps.capture.outputs.current_sha }}
      package_version: ${{ steps.capture.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run lint
        run: npm run lint --if-present || echo "lint skipped"

      - name: Run tests
        run: npm test --if-present || echo "tests skipped"

      - name: Capture commit and version info
        id: capture
        run: |
          CURRENT_SHA="${{ github.sha }}"
          PREVIOUS_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "${{ github.event.before }}")
          if [ -z "$PREVIOUS_SHA" ] || [ "$PREVIOUS_SHA" = "0000000000000000000000000000000000000000" ]; then
            PREVIOUS_SHA="$CURRENT_SHA"
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current SHA: $CURRENT_SHA"
          echo "Previous SHA: $PREVIOUS_SHA"
          echo "Package Version: $PACKAGE_VERSION"

      - name: Create deployment tracking issue
        id: create_issue
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const shortSha = sha.substring(0, 7);
            const previousSha = '${{ steps.capture.outputs.previous_sha }}';
            const packageVersion = '${{ steps.capture.outputs.package_version }}';
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${sha}`,
              body: [
                '## 🚀 Deployment Tracking',
                '',
                `- **Current Commit:** \`${sha}\``,
                `- **Previous Commit:** \`${previousSha}\``,
                `- **Package Version:** \`${packageVersion}\``,
                `- **Triggered By:** @${context.actor}`,
                `- **Workflow Run:** [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                'This issue tracks the progress of the deployment pipeline.',
              ].join('
'),
              labels: ['deployment', 'in-progress'],
            });
            core.setOutput('issue_number', issue.data.number);
            return issue.data.number;

      - name: Post pre-deployment completion comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.create_issue.outputs.issue_number }}', 10);
            const previousSha = '${{ steps.capture.outputs.previous_sha }}';
            const currentSha = '${{ steps.capture.outputs.current_sha }}';
            const packageVersion = '${{ steps.capture.outputs.package_version }}';
            const body = [
              '## ✅ Pre-deployment checks completed',
              '',
              'All quality gates have passed (lint and test).',
              '',
              `- **Previous Commit:** \`${previousSha}\``,
              `- **Current Commit:** \`${currentSha}\``,
              `- **Package Version:** \`${packageVersion}\``,
              '',
              'Proceeding to rollback preparation stage...',
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    outputs:
      checksum: ${{ steps.checksum.outputs.sha256 }}
      artifact_name: ${{ steps.pkg.outputs.artifact_name }}
      script_created: ${{ steps.verify.outputs.script_created }}
      backup_created: ${{ steps.verify.outputs.backup_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare rollback workspace
        run: |
          mkdir -p rollback-package/scripts
          mkdir -p rollback-package/backups
          mkdir -p rollback-package/docs

      - name: Create executable rollback script
        id: script
        run: |
          cat > rollback-package/scripts/rollback.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          # Rollback Script
          # Restores a previous deployment by checking out the previous commit
          # and reinstalling dependencies from the backed-up lockfile.

          PREVIOUS_SHA="${PREVIOUS_SHA:-${{ needs.pre-deployment.outputs.previous_sha }}}"
          CURRENT_SHA="${CURRENT_SHA:-${{ needs.pre-deployment.outputs.current_sha }}}"

          log() { echo "[rollback] $*"; }
          err() { echo "[rollback][error] $*" >&2; }

          trap 'err "Rollback failed at line $LINENO"; exit 1' ERR

          if [ -z "$PREVIOUS_SHA" ]; then
            err "PREVIOUS_SHA is required"
            exit 1
          fi

          log "Starting rollback from $CURRENT_SHA to $PREVIOUS_SHA"

          if [ ! -d .git ]; then
            err "Not inside a git repository"
            exit 1
          fi

          log "Fetching latest refs"
          git fetch --all --tags

          log "Checking out previous commit: $PREVIOUS_SHA"
          git checkout "$PREVIOUS_SHA"

          if [ -f backups/package.json ]; then
            log "Restoring package.json from backup"
            cp backups/package.json ./package.json
          fi

          if [ -f backups/package-lock.json ]; then
            log "Restoring package-lock.json from backup"
            cp backups/package-lock.json ./package-lock.json
          fi

          log "Reinstalling dependencies"
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          log "Running smoke tests"
          npm test --if-present || log "no tests defined"

          log "Rollback completed successfully"
          EOF
          chmod +x rollback-package/scripts/rollback.sh
          echo "script_path=rollback-package/scripts/rollback.sh" >> "$GITHUB_OUTPUT"

      - name: Create configuration backups
        id: backup
        run: |
          if [ -f package.json ]; then
            cp package.json rollback-package/backups/package.json
          fi
          if [ -f package-lock.json ]; then
            cp package-lock.json rollback-package/backups/package-lock.json
          fi
          cat > rollback-package/backups/.env.template << 'EOF'
          # Environment variable template captured at deployment time.
          # Copy to .env and fill in real values before running the application.
          NODE_ENV=production
          PORT=3000
          LOG_LEVEL=info
          # Add additional environment variables as required by the application.
          EOF
          echo "backup_dir=rollback-package/backups" >> "$GITHUB_OUTPUT"

      - name: Create dependency verification script
        run: |
          cat > rollback-package/scripts/verify-dependencies.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          # Dependency verification script
          # Compares the dependency tree of the rolled-back package.json against
          # the running environment to detect compatibility issues.

          log() { echo "[verify-deps] $*"; }
          err() { echo "[verify-deps][error] $*" >&2; }

          trap 'err "Verification failed at line $LINENO"; exit 1' ERR

          if [ ! -f package.json ]; then
            err "package.json not found"
            exit 1
          fi

          log "Checking Node.js version"
          node --version

          log "Checking npm version"
          npm --version

          log "Validating package.json"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

          log "Listing installed dependencies"
          npm ls --depth=0 || log "Dependency tree has issues, please review"

          log "Auditing dependencies"
          npm audit --production || log "Audit reported issues; review before continuing"

          log "Dependency verification completed"
          EOF
          chmod +x rollback-package/scripts/verify-dependencies.sh

      - name: Create rollback documentation
        run: |
          cat > rollback-package/docs/ROLLBACK.md << 'EOF'
          # Rollback Documentation

          This package contains everything required to roll the application back
          to the previous known-good commit.

          ## Contents

          - `scripts/rollback.sh` — executable rollback script with error handling.
          - `scripts/verify-dependencies.sh` — dependency compatibility check.
          - `backups/package.json` — package manifest captured before deployment.
          - `backups/package-lock.json` — lockfile captured before deployment.
          - `backups/.env.template` — environment variable template.

          ## Step-by-step rollback

          1. Download and extract the rollback artifact:
             ```bash
             tar -xzf rollback-package.tar.gz
             cd rollback-package
             ```
          2. Verify the checksum recorded in `checksums.txt`.
          3. Run the rollback script:
             ```bash
             PREVIOUS_SHA=<previous-commit-sha> ./scripts/rollback.sh
             ```
          4. Verify dependencies are healthy:
             ```bash
             ./scripts/verify-dependencies.sh
             ```
          5. Restart the application service and run smoke tests.

          ## Quick rollback command

          ```bash
          PREVIOUS_SHA=<previous-commit-sha> ./scripts/rollback.sh
          ```

          ## Troubleshooting

          - If `npm ci` fails, fall back to `npm install` after verifying the
            lockfile integrity.
          - If the previous commit cannot be checked out, ensure the repository
            history is fetched with `git fetch --all --tags`.
          EOF

      - name: Verify rollback artifacts
        id: verify
        run: |
          SCRIPT_OK=false
          BACKUP_OK=false
          if [ -x rollback-package/scripts/rollback.sh ]; then
            bash -n rollback-package/scripts/rollback.sh
            SCRIPT_OK=true
          fi
          if [ -f rollback-package/backups/package.json ] && [ -f rollback-package/backups/package-lock.json ]; then
            BACKUP_OK=true
          fi
          echo "script_created=$SCRIPT_OK" >> "$GITHUB_OUTPUT"
          echo "backup_created=$BACKUP_OK" >> "$GITHUB_OUTPUT"
          echo "Rollback script created: $SCRIPT_OK"
          echo "Configuration backup: $BACKUP_OK"

      - name: Package and checksum rollback artifact
        id: pkg
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ARTIFACT_NAME="rollback-package-${{ github.sha }}"
          tar -czf "rollback-package.tar.gz" rollback-package
          sha256sum rollback-package.tar.gz > rollback-package/checksums.txt
          # Re-package now that checksum file is included
          tar -czf "rollback-package.tar.gz" rollback-package
          sha256sum rollback-package.tar.gz | tee rollback-package.sha256
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Compute final SHA256 checksum
        id: checksum
        run: |
          CHECKSUM=$(sha256sum rollback-package.tar.gz | awk '{print $1}')
          echo "sha256=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "Computed checksum: $CHECKSUM"

      - name: Upload rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: |
            rollback-package.tar.gz
            rollback-package.sha256
          retention-days: 30

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}', 10);
            const previousSha = '${{ needs.pre-deployment.outputs.previous_sha }}';
            const currentSha = '${{ needs.pre-deployment.outputs.current_sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package_version }}';
            const artifactName = '${{ steps.pkg.outputs.artifact_name }}';
            const checksum = '${{ steps.checksum.outputs.sha256 }}';
            const scriptCreated = '${{ steps.verify.outputs.script_created }}';
            const backupCreated = '${{ steps.verify.outputs.backup_created }}';
            const body = [
              '## 🔄 Rollback Plan Ready',
              '',
              'The rollback package has been built, verified, and uploaded as a workflow artifact.',
              '',
              '### Deployment metadata',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              `- Artifact: ${artifactName}`,
              `- SHA256: ${checksum}`,
              '',
              '### Rollback components',
              '- ✅ Executable rollback script with error handling (`scripts/rollback.sh`)',
              '- ✅ Configuration backups for package.json, package-lock.json and environment template',
              '- ✅ Dependency verification script (`scripts/verify-dependencies.sh`)',
              '- ✅ Detailed rollback documentation (`docs/ROLLBACK.md`)',
              '- ✅ Compressed rollback package with SHA256 checksums',
              '- ✅ Artifact uploaded to GitHub Actions with 30-day retention',
              '',
              '### Verification',
              `- Rollback script created: ${scriptCreated}`,
              `- Configuration backup: ${backupCreated}`,
              '',
              '### Quick rollback command',
              '',
              '```bash',
              `PREVIOUS_SHA=${previousSha} ./scripts/rollback.sh`,
              '```',
              '',
              'Download the `' + artifactName + '` artifact, verify the SHA256 checksum, extract it, and run the command above to restore the previous deployment.',
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs: [pre-deployment, rollback-preparation]
    steps:
      - name: Update labels and close tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}', 10);
            const artifactName = '${{ needs.rollback-preparation.outputs.artifact_name }}';
            const checksum = '${{ needs.rollback-preparation.outputs.checksum }}';
            const previousSha = '${{ needs.pre-deployment.outputs.previous_sha }}';
            const currentSha = '${{ needs.pre-deployment.outputs.current_sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package_version }}';

            // Remove the in-progress label (ignore 404 if not present)
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress',
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            // Add the completed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed'],
            });

            const body = [
              '## 🎉 Deployment Completed Successfully',
              '',
              'The deployment pipeline finished without errors and the application is live.',
              '',
              '### Summary',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              '',
              '### Rollback artifact details',
              `- Artifact: ${artifactName}`,
              `- SHA256: ${checksum}`,
              '- Retention: 30 days',
              '',
              'Closing this tracking issue. If a rollback becomes necessary, download the artifact above and follow the documented quick rollback command.',
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
            });
